name: flutter_linkme_sdk_windows
description: Windows protocol activation and LinkMe click-token claims for Flutter.
version: 0.1.0
publish_to: none
repository: https://github.com/r-dev-limited/li-nk.me-flutter-sdk

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_linkme_sdk: '>=0.2.13 <0.4.0'
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: flutter_linkme_sdk
    platforms:
      windows:
        pluginClass: FlutterLinkmeSdkWindowsPluginCApi
        dartPluginClass: FlutterLinkmeSdkWindows
