name: Flutter SDK CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage
      - run: dart run tool/check_lcov.dart
      - run: flutter analyze
      - run: flutter pub get
        working-directory: example
      - run: flutter build web --no-pub
        working-directory: example
      - run: flutter build web --wasm --no-pub
        working-directory: example
      - run: flutter build apk --debug --no-pub
        working-directory: example

  native-consumer:
    name: Clean SwiftPM consumer (iOS and macOS)
    # LinkMeKit 0.2.16 is validated with the Xcode 26.x toolchain on macos-26.
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Stage package-name consumer
        shell: bash
        run: |
          set -euo pipefail
          consumer_root="$RUNNER_TEMP/flutter-linkme-consumer"
          mkdir -p "$consumer_root/flutter_linkme_sdk" "$consumer_root/example"
          rsync -a --delete \
            --exclude='.git' --exclude='.dart_tool' --exclude='build' \
            --exclude='coverage' --exclude='example' \
            ./ "$consumer_root/flutter_linkme_sdk/"
          rsync -a --delete \
            --exclude='.git' --exclude='.dart_tool' --exclude='build' \
            --exclude='ios/Pods' --exclude='ios/Flutter/ephemeral' \
            --exclude='macos/Pods' --exclude='macos/Flutter/ephemeral' \
            --exclude='android/.gradle' \
            example/ "$consumer_root/example/"
          sed -i '' 's|path: \.\./|path: ../flutter_linkme_sdk|' \
            "$consumer_root/example/pubspec.yaml"
          echo "FLUTTER_CONSUMER_ROOT=$consumer_root" >> "$GITHUB_ENV"
      - name: Resolve clean consumer
        run: flutter pub get
        working-directory: ${{ env.FLUTTER_CONSUMER_ROOT }}/example
      - name: Build iOS simulator consumer
        run: flutter build ios --simulator --no-codesign --no-pub
        working-directory: ${{ env.FLUTTER_CONSUMER_ROOT }}/example
      - name: Run iOS plugin bridge tests
        shell: bash
        run: |
          simulator_id=$(xcrun simctl list devices available --json | jq -r '.devices[][] | select(.isAvailable and (.name | startswith("iPhone"))) | .udid' | head -n 1)
          test -n "$simulator_id"
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/flutter-ios-tests" \
            CODE_SIGNING_ALLOWED=NO
        working-directory: ${{ env.FLUTTER_CONSUMER_ROOT }}/example
      - name: Build macOS consumer
        run: flutter build macos --no-pub
        working-directory: ${{ env.FLUTTER_CONSUMER_ROOT }}/example
      - name: Run macOS plugin tests
        run: >-
          xcodebuild test
          -workspace macos/Runner.xcworkspace
          -scheme Runner
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath $RUNNER_TEMP/flutter-macos-tests
          CODE_SIGNING_ALLOWED=NO
        working-directory: ${{ env.FLUTTER_CONSUMER_ROOT }}/example
